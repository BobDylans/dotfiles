# : Manager [[[

[mgr]
cwd = { fg = "#c6b7aa" }

# Find
find_keyword = { fg = "#ff5f52", bold = true, italic = true, underline = true }
find_position = { fg = "#ff5f52", bold = true, italic = true }

# Marker
marker_copied = { fg = "#00a4dc", bg = "#00a4dc" }
marker_cut = { fg = "#005876", bg = "#005876" }
marker_marked = { fg = "#ff5f52", bg = "#ff5f52" }
marker_selected = { fg = "#00a0d4", bg = "#00a0d4" }

# Count
count_copied = { fg = "#b7e4ff", bg = "#005876" }
count_cut = { fg = "#b7e4ff", bg = "#005876" }
count_selected = { fg = "#381e00", bg = "#00a0d4" }

# Border
border_symbol = "│"
border_style = { fg = "#ffb86b" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active = { fg = "#d58200", bold = true, bg = "#1a120a" }
inactive = { fg = "#bc8b57", bg = "#1a120a" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#d58200", fg = "#381e00", bold = true }
normal_alt = { bg = "#544434", fg = "#a6917e" }

# Select mode
select_main = { bg = "#bc8b57", fg = "#281400", bold = true }
select_alt = { bg = "#544434", fg = "#a6917e" }

# Unset mode
unset_main = { bg = "#00a0d4", fg = "#001c28", bold = true }
unset_alt = { bg = "#544434", fg = "#a6917e" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type = { fg = "#573e23" }
perm_write = { fg = "#6edbff" }
perm_read = { fg = "#b80e00" }
perm_exec = { fg = "#10c2ff" }
perm_sep = { fg = "#ff9e10" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#d58200", bg = "#41372e" }
progress_error = { fg = "#ff5f52", bg = "#41372e" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#41372e" }
cand = { fg = "#d58200" }
rest = { fg = "#381e00" }
desc = { fg = "#c6b7aa" }
separator = " ▶ "
separator_style = { fg = "#c6b7aa" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#00a0d4" }
title_warn = { fg = "#d58200" }
title_error = { fg = "#ff5f52" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#d58200" }
active = { fg = "#00a0d4", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#d58200" }
value = { fg = "#c6b7aa" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#d58200", bg = "#381e00" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#d58200" }
title = {}
hovered = { fg = "#005876", underline = true }

# : ]]]


# : Help [[[

[help]
on = { fg = "#c6b7aa" }
run = { fg = "#c6b7aa" }
footer = { fg = "#281400", bg = "#bc8b57" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
  # Images
  { mime = "image/*", fg = "#94e2d5" },

  # Media
  { mime = "{audio,video}/*", fg = "#f9e2af" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

  # Fallback
  { url = "*", fg = "#c6b7aa" },
  { url = "*/", fg = "#ffb86b" },
]


# : ]]]
# : Icon [[[

[icon]
# ==========================================
# 1. 预设条件 (最高优先级)
# ==========================================
prepend_conds = [
  # 隐藏的文件夹 (半透明或较暗的颜色)
  { if = "dir & hidden", text = "", fg = "#ffe9d1" },

  # 普通文件夹 - 提到前面来，确保文件夹图标最先被匹配
  { if = "dir", text = "", fg = "#ffb86b" },

  # 损坏的符号链接 (孤儿) - 使用 Error 色
  { if = "orphan", text = "󰌌", fg = "#ff5f52" },
  # 正常的符号链接 - 使用 Tertiary 固定色
  { if = "link", text = "󰌷", fg = "#005876" },

  # 可执行文件 - 【关键修复：必须排除文件夹 (!dir)】
  { if = "exec & !dir", text = "󰆧", fg = "#bc8b57" },

  # 普通隐藏文件 (暗淡的文字色)
  { if = "hidden", text = "󰈙", fg = "#a6917e" },
]

# ==========================================
# 2. 预设目录 (特殊文件夹图标与主色调)
# ==========================================
prepend_dirs = [
  # 使用 Primary 颜色高亮常用主目录
  { name = "Desktop", text = "", fg = "#d58200" },
  { name = "Documents", text = "󰈙", fg = "#d58200" },
  { name = "Downloads", text = "󰇚", fg = "#d58200" },
  { name = "Pictures", text = "󰉏", fg = "#d58200" },
  { name = "Music", text = "󰎆", fg = "#d58200" },
  { name = "Videos", text = "󰕧", fg = "#d58200" },
  { name = "Public", text = "", fg = "#d58200" },

  # 使用 Secondary 颜色标记开发/配置目录
  { name = ".config", text = "", fg = "#bc8b57" },
  { name = ".git", text = "󰊢", fg = "#bc8b57" },
  { name = "Github", text = "󰊢", fg = "#bc8b57" },
  { name = "src", text = "", fg = "#bc8b57" },
]

# ==========================================
# 3. 预设文件扩展名
# ==========================================
prepend_exts = [
  # 图片/媒体 - 使用 Tertiary 颜色 (提供视觉对比)
  { name = "png", text = "󰉏", fg = "#00a0d4" },
  { name = "jpg", text = "󰉏", fg = "#00a0d4" },
  { name = "jpeg", text = "󰉏", fg = "#00a0d4" },
  { name = "webp", text = "󰉏", fg = "#00a0d4" },
  { name = "svg", text = "󰜡", fg = "#00a0d4" },
  { name = "mp4", text = "󰕧", fg = "#00a0d4" },
  { name = "mkv", text = "󰕧", fg = "#00a0d4" },
  { name = "mp3", text = "󰎆", fg = "#00a0d4" },
  { name = "flac", text = "󰎆", fg = "#00a0d4" },

  # 档案/压缩包 - 使用 Error Container 相关的颜色 (以示区别，或可选 tertiary_fixed)
  { name = "zip", text = "󰛫", fg = "#003f56" },
  { name = "tar", text = "󰛫", fg = "#003f56" },
  { name = "gz", text = "󰛫", fg = "#003f56" },
  { name = "rar", text = "󰛫", fg = "#003f56" },
  { name = "7z", text = "󰛫", fg = "#003f56" },

  # 常用代码/配置文件 - 使用 Primary 或 On Surface 色
  { name = "conf", text = "", fg = "#d58200" },
  { name = "toml", text = "", fg = "#d58200" },
  { name = "yaml", text = "", fg = "#d58200" },
  { name = "yml", text = "", fg = "#d58200" },
  { name = "json", text = "", fg = "#d58200" },
  { name = "sh", text = "", fg = "#d58200" },
  { name = "bash", text = "", fg = "#d58200" },
  { name = "py", text = "", fg = "#d58200" },
  { name = "rs", text = "", fg = "#d58200" },
  { name = "c", text = "", fg = "#d58200" },
  { name = "cpp", text = "", fg = "#d58200" },
  { name = "md", text = "", fg = "#d58200" },
  { name = "txt", text = "󰈙", fg = "#c6b7aa" },
]

# ==========================================
# 4. 预设特定文件名
# ==========================================
prepend_files = [
  { name = "PKGBUILD", text = "", fg = "#d58200" },
  { name = "README.md", text = "󰂺", fg = "#bc8b57" },
  { name = "Makefile", text = "", fg = "#bc8b57" },
  { name = ".bashrc", text = "", fg = "#bc8b57" },
  { name = ".zshrc", text = "", fg = "#bc8b57" },
]

# : ]]]
