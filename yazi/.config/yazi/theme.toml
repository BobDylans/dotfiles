# : Manager [[[

[mgr]
cwd = { fg = "#c0b8b4" }

# Find
find_keyword = { fg = "#ff5f52", bold = true, italic = true, underline = true }
find_position = { fg = "#ff5f52", bold = true, italic = true }

# Marker
marker_copied = { fg = "#5096a2", bg = "#5096a2" }
marker_cut = { fg = "#2e575e", bg = "#2e575e" }
marker_marked = { fg = "#ff5f52", bg = "#ff5f52" }
marker_selected = { fg = "#739ca3", bg = "#739ca3" }

# Count
count_copied = { fg = "#bae5ed", bg = "#2e575e" }
count_cut = { fg = "#bae5ed", bg = "#2e575e" }
count_selected = { fg = "#3a1c07", bg = "#739ca3" }

# Border
border_symbol = "│"
border_style = { fg = "#f1bb9c" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active = { fg = "#bb8b6e", bold = true, bg = "#171310" }
inactive = { fg = "#a99082", bg = "#171310" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#bb8b6e", fg = "#3a1c07", bold = true }
normal_alt = { bg = "#51443d", fg = "#a2928a" }

# Select mode
select_main = { bg = "#a99082", fg = "#24150c", bold = true }
select_alt = { bg = "#51443d", fg = "#a2928a" }

# Unset mode
unset_main = { bg = "#739ca3", fg = "#001c21", bold = true }
unset_alt = { bg = "#51443d", fg = "#a2928a" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type = { fg = "#56453c" }
perm_write = { fg = "#32484b" }
perm_read = { fg = "#b80e00" }
perm_exec = { fg = "#6dadb8" }
perm_sep = { fg = "#c49373" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#bb8b6e", bg = "#3d3835" }
progress_error = { fg = "#ff5f52", bg = "#3d3835" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#3d3835" }
cand = { fg = "#bb8b6e" }
rest = { fg = "#3a1c07" }
desc = { fg = "#c0b8b4" }
separator = " ▶ "
separator_style = { fg = "#c0b8b4" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#739ca3" }
title_warn = { fg = "#bb8b6e" }
title_error = { fg = "#ff5f52" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#bb8b6e" }
active = { fg = "#739ca3", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#bb8b6e" }
value = { fg = "#c0b8b4" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#bb8b6e", bg = "#3a1c07" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#bb8b6e" }
title = {}
hovered = { fg = "#2e575e", underline = true }

# : ]]]


# : Help [[[

[help]
on = { fg = "#c0b8b4" }
run = { fg = "#c0b8b4" }
footer = { fg = "#24150c", bg = "#a99082" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
  # Images
  { mime = "image/*", fg = "#94e2d5" },

  # Media
  { mime = "{audio,video}/*", fg = "#f9e2af" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

  # Fallback
  { url = "*", fg = "#c0b8b4" },
  { url = "*/", fg = "#f1bb9c" },
]


# : ]]]
# : Icon [[[

[icon]
# ==========================================
# 1. 预设条件 (最高优先级)
# ==========================================
prepend_conds = [
  # 隐藏的文件夹 (半透明或较暗的颜色)
  { if = "dir & hidden", text = "", fg = "#fef8f5" },

  # 普通文件夹 - 提到前面来，确保文件夹图标最先被匹配
  { if = "dir", text = "", fg = "#f1bb9c" },

  # 损坏的符号链接 (孤儿) - 使用 Error 色
  { if = "orphan", text = "󰌌", fg = "#ff5f52" },
  # 正常的符号链接 - 使用 Tertiary 固定色
  { if = "link", text = "󰌷", fg = "#2e575e" },

  # 可执行文件 - 【关键修复：必须排除文件夹 (!dir)】
  { if = "exec & !dir", text = "󰆧", fg = "#a99082" },

  # 普通隐藏文件 (暗淡的文字色)
  { if = "hidden", text = "󰈙", fg = "#a2928a" },
]

# ==========================================
# 2. 预设目录 (特殊文件夹图标与主色调)
# ==========================================
prepend_dirs = [
  # 使用 Primary 颜色高亮常用主目录
  { name = "Desktop", text = "", fg = "#bb8b6e" },
  { name = "Documents", text = "󰈙", fg = "#bb8b6e" },
  { name = "Downloads", text = "󰇚", fg = "#bb8b6e" },
  { name = "Pictures", text = "󰉏", fg = "#bb8b6e" },
  { name = "Music", text = "󰎆", fg = "#bb8b6e" },
  { name = "Videos", text = "󰕧", fg = "#bb8b6e" },
  { name = "Public", text = "", fg = "#bb8b6e" },

  # 使用 Secondary 颜色标记开发/配置目录
  { name = ".config", text = "", fg = "#a99082" },
  { name = ".git", text = "󰊢", fg = "#a99082" },
  { name = "Github", text = "󰊢", fg = "#a99082" },
  { name = "src", text = "", fg = "#a99082" },
]

# ==========================================
# 3. 预设文件扩展名
# ==========================================
prepend_exts = [
  # 图片/媒体 - 使用 Tertiary 颜色 (提供视觉对比)
  { name = "png", text = "󰉏", fg = "#739ca3" },
  { name = "jpg", text = "󰉏", fg = "#739ca3" },
  { name = "jpeg", text = "󰉏", fg = "#739ca3" },
  { name = "webp", text = "󰉏", fg = "#739ca3" },
  { name = "svg", text = "󰜡", fg = "#739ca3" },
  { name = "mp4", text = "󰕧", fg = "#739ca3" },
  { name = "mkv", text = "󰕧", fg = "#739ca3" },
  { name = "mp3", text = "󰎆", fg = "#739ca3" },
  { name = "flac", text = "󰎆", fg = "#739ca3" },

  # 档案/压缩包 - 使用 Error Container 相关的颜色 (以示区别，或可选 tertiary_fixed)
  { name = "zip", text = "󰛫", fg = "#134046" },
  { name = "tar", text = "󰛫", fg = "#134046" },
  { name = "gz", text = "󰛫", fg = "#134046" },
  { name = "rar", text = "󰛫", fg = "#134046" },
  { name = "7z", text = "󰛫", fg = "#134046" },

  # 常用代码/配置文件 - 使用 Primary 或 On Surface 色
  { name = "conf", text = "", fg = "#bb8b6e" },
  { name = "toml", text = "", fg = "#bb8b6e" },
  { name = "yaml", text = "", fg = "#bb8b6e" },
  { name = "yml", text = "", fg = "#bb8b6e" },
  { name = "json", text = "", fg = "#bb8b6e" },
  { name = "sh", text = "", fg = "#bb8b6e" },
  { name = "bash", text = "", fg = "#bb8b6e" },
  { name = "py", text = "", fg = "#bb8b6e" },
  { name = "rs", text = "", fg = "#bb8b6e" },
  { name = "c", text = "", fg = "#bb8b6e" },
  { name = "cpp", text = "", fg = "#bb8b6e" },
  { name = "md", text = "", fg = "#bb8b6e" },
  { name = "txt", text = "󰈙", fg = "#c0b8b4" },
]

# ==========================================
# 4. 预设特定文件名
# ==========================================
prepend_files = [
  { name = "PKGBUILD", text = "", fg = "#bb8b6e" },
  { name = "README.md", text = "󰂺", fg = "#a99082" },
  { name = "Makefile", text = "", fg = "#a99082" },
  { name = ".bashrc", text = "", fg = "#a99082" },
  { name = ".zshrc", text = "", fg = "#a99082" },
]

# : ]]]
