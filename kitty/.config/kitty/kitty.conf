include dank-tabs.conf
include dank-theme.conf
allow_remote_control yes
listen_on unix:/tmp/kitty
window_padding_width 5
hide_window_decorations yes
background_opacity 0.9
# 英文+中文都用 Maple Mono NF CN（等宽统一）
# font_family Maple Mono NF CN
font_family_fallback LXGW WenKai Mono
font_size 12
remember_window_size no
remember_window_position no
# 启动时全屏
fullscreen yes
confirm_os_window_close 0
shell fish
cursor_trail 15
cursor_trail_decay 0.03 0.4
cursor_trail_start_threshold 0
cursor_shape block
shell_integration no-cursor
cursor_blink_interval 0

map alt+left previous_tab
map alt+right next_tab

map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

map ctrl+shift+s kitten screenshot


include themes/noctalia.conf




# BEGIN_KITTY_THEME
# Kanagawa_dragon
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="Maple Mono NF CN"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS